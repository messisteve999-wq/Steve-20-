name: Build Steve-20- Android APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: "platform-tools"
          accept-android-sdk-licenses: true

      - name: Install Android packages
        run: |
          sdkmanager --install \
            "platform-tools" \
            "platforms;android-34" \
            "build-tools;34.0.0"

      - name: Download Godot 4.3 and export templates
        shell: bash
        run: |
          set -e
          mkdir -p "$HOME/.local/share/godot/export_templates/4.3.stable"
          wget -q \
            "https://downloads.godotengine.org/?flavor=stable&platform=linux.64&slug=linux.x86_64.zip&version=4.3" \
            -O /tmp/godot.zip
          unzip -oq /tmp/godot.zip -d /tmp/godot-bin
          GODOT="$(find /tmp/godot-bin -type f -name 'Godot_v4.3*linux.x86_64' | head -n 1)"
          test -n "$GODOT"
          chmod +x "$GODOT"
          echo "GODOT=$GODOT" >> "$GITHUB_ENV"

          wget -q \
            "https://downloads.godotengine.org/?flavor=stable&platform=templates&slug=export_templates.tpz&version=4.3" \
            -O /tmp/godot-templates.tpz
          unzip -oq -j /tmp/godot-templates.tpz \
            -d "$HOME/.local/share/godot/export_templates/4.3.stable"
          test -s "$HOME/.local/share/godot/export_templates/4.3.stable/android_debug.apk"

      - name: Configure Android debug signing
        shell: bash
        run: |
          set -e
          mkdir -p "$HOME/.android" "$HOME/.config/godot"
          keytool -genkeypair \
            -keystore "$HOME/.android/debug.keystore" \
            -storepass android \
            -alias androiddebugkey \
            -keypass android \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -dname "CN=Android Debug,O=Android,C=US" \
            -noprompt

          cat > "$HOME/.config/godot/editor_settings-4.tres" <<SETTINGS
          [gd_resource type="EditorSettings" format=3]

          [resource]
          export/android/android_sdk_path = "$ANDROID_HOME"
          export/android/java_sdk_path = "$JAVA_HOME"
          export/android/debug_keystore = "$HOME/.android/debug.keystore"
          export/android/debug_keystore_user = "androiddebugkey"
          export/android/debug_keystore_pass = "android"
          SETTINGS

          test -x "$JAVA_HOME/bin/java"
          test -x "$ANDROID_HOME/platform-tools/adb"
          test -s "$HOME/.android/debug.keystore"

      - name: Import Godot project
        run: |
          set -e
          "$GODOT" --headless --path . --editor --import
          test -f project.godot
          test -f export_presets.cfg

      - name: Export Android APK
        run: |
          set -e
          mkdir -p build
          "$GODOT" --headless --editor --path . --quit --verbose
          "$GODOT" --headless --path . \
                   --export-debug "Android" "build/Steve-20-.apk" --verbose
          test -s build/Steve-20-.apk
          ls -lh build/Steve-20-.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Steve-20-Android-APK
          path: build/Steve-20-.apk
          if-no-files-found: error
          retention-days: 7
